[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[package]
name = "ferramari"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Video wallpaper for Linux, written in Rust"
readme = "README.md"
keywords = ["wallpaper", "video", "linux"]
categories = ["multimedia::video", "graphics"]

[dependencies]
ferramari-core = { path = "crates/ferramari-core" }
ferramari-platform = { path = "crates/ferramari-platform" }
ferramari-media = { path = "crates/ferramari-media" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
base64 = "0.22"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
log = "0.4"
rand = "0.8"
regex = "1"
# Ed25519 for `.ferramari` package signatures. `ring` is already in the tree
# through `ureq`/rustls, so this adds no new native dependency.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
x11rb = { version = "0.14", features = ["randr"] }
zbus = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true