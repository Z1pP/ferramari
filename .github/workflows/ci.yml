name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: "ferramari-ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and desktop metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gettext appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Parse and format every workspace crate
        run: |
          cargo fmt --all
          git diff --check
      - name: Assert all workspace feature sets are GTK-free
        run: |
          if cargo tree --workspace --locked --all-features -e normal | \
            grep -E '(^| )(gtk|gdk|webkit2gtk|gdk-pixbuf|glib|gio|pango|cairo-rs) v'; then
            echo "GTK/GDK-family dependency found in a workspace feature graph"
            exit 1
          fi
      - name: Lint every workspace target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test every workspace crate
        run: cargo test --workspace --locked
      - name: Build server and Iced UI
        run: cargo build --workspace --release --locked
      - name: Verify both application binaries exist
        run: |
          test -x target/release/ferramari
          test -x target/release/ferramari-ui
      - name: Verify staged installation
        run: |
          stage="$RUNNER_TEMP/ferramari-stage"
          make install CARGO=true DESTDIR="$stage" PREFIX=/usr TARGET_DIR=target
          test -x "$stage/usr/bin/ferramari"
          test -x "$stage/usr/bin/ferramari-ui"
          grep -Fx 'Exec=/usr/bin/ferramari' "$stage/usr/share/applications/io.github.ferramari.Ferramari.desktop"
          test -s "$stage/usr/share/metainfo/io.github.ferramari.Ferramari.metainfo.xml"
          test -s "$stage/usr/share/icons/hicolor/scalable/apps/io.github.ferramari.Ferramari.svg"
          test -s "$stage/usr/share/locale/ru/LC_MESSAGES/ferramari.mo"
          # The server and UI are installed side by side; both must remain GTK-free.
          for binary in "$stage/usr/bin/ferramari" "$stage/usr/bin/ferramari-ui"; do
            if ldd "$binary" | grep -E 'lib(gtk|gdk|webkit2gtk)[^ ]*'; then
              echo "GTK/GDK/WebKitGTK runtime dependency found in $binary"
              exit 1
            fi
          done
      - name: Validate translations
        run: |
          for po in po/*.po; do
            msgfmt --check -c -o /dev/null "$po"
          done
      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net data/io.github.ferramari.Ferramari.metainfo.xml
          desktop-file-validate data/io.github.ferramari.Ferramari.desktop
      - name: Check version consistency
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          release_version=$(grep -o 'release version="[^"]*"' \
            data/io.github.ferramari.Ferramari.metainfo.xml | head -n1 | cut -d'"' -f2)
          test -n "$cargo_version"
          test "$cargo_version" = "$release_version"
          echo "version $cargo_version"

  audit:
    runs-on: ubuntu-latest
    # `audit-check` publishes its findings as a "Security audit" check run.
    # Without `checks: write` the Check API call is rejected, the action throws
    # and the job fails even when only informational advisories exist.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the existing explicitly reviewed advisory exceptions. Real
          # vulnerabilities remain blocking; revisit exceptions as deps move.
          ignore: >-
            RUSTSEC-2024-0370,
            RUSTSEC-2024-0429,
            RUSTSEC-2026-0370,
            RUSTSEC-2026-0371,
            RUSTSEC-2026-0372

