name: Refresh Cargo.lock

on:
  push:
    branches: [work/finish-iced-migration]
    paths:
      - crates/ferramari-ui/Cargo.toml

permissions:
  contents: write

jobs:
  lockfile:
    if: contains(github.event.head_commit.message, '[regen-lock]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and compile the UI dependency graph
        run: cargo check -p ferramari-ui
      - name: Commit the resolved lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update Cargo.lock for native file dialogs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
