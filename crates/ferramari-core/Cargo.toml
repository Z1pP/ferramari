[package]
name = "ferramari-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ferramari core library: paths, configuration, business logic"

[target.'cfg(target_os = "windows")'.dependencies]
# Process-tree sampling reads the Windows process table and per-process
# counters directly; the same `windows` crate version the platform layer uses.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # `GetUserDefaultUILanguage`/`LCIDToLocaleName`: "System" must follow the
    # Windows display language, which is not exported as LANG.
    "Win32_Globalization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
rand = "0.8"
regex = "1"
ring = "0.17"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
