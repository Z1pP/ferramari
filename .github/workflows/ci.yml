name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3, WebKitGTK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config \
            gettext appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Validate translations
        run: |
          for po in po/*.po; do
            msgfmt --check -c -o /dev/null "$po"
          done
      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net data/io.github.ferramari.Ferramari.metainfo.xml
          desktop-file-validate data/io.github.ferramari.Ferramari.desktop
      - name: Check version consistency
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          release_version=$(grep -o 'release version="[^"]*"' \
            data/io.github.ferramari.Ferramari.metainfo.xml | head -n1 | cut -d'"' -f2)
          test -n "$cargo_version"
          test "$cargo_version" = "$release_version"
          echo "version $cargo_version"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # These are informational unmaintained/unsound notices from the
          # current GTK/zbus stack, not vulnerabilities. The action treats any
          # warning as a failure, so list them explicitly and keep real
          # RUSTSEC vulnerabilities blocking.
          ignore: >-
            RUSTSEC-2024-0370,
            RUSTSEC-2024-0429,
            RUSTSEC-2026-0370,
            RUSTSEC-2026-0371,
            RUSTSEC-2026-0372

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4