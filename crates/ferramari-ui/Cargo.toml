[package]
name = "ferramari-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ferramari Iced UI: D-Bus client of the wallpaper server"

[dependencies]
ferramari-core = { path = "../ferramari-core" }

# `canvas` powers the sparklines on the Home and Performance pages; it is a
# renderer feature, not a new dependency — the geometry crate is already in
# the tree through the default `tiny-skia` backend.
iced = { version = "0.14", features = ["tokio", "image", "canvas"] }
# XDG Desktop Portal on Linux; native system dialogs on macOS and Windows.
# This dependency intentionally uses no GTK feature.
# The Linux backend is the XDG Desktop Portal, not a toolkit binding.
# Default features do not enable GTK bindings.
rfd = "0.17.2"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
zbus = "5"
zvariant = "5"

[target.'cfg(target_os = "windows")'.dependencies]
# The control transport and wire types are shared with the server. The
# platform crate has no toolkit dependency, so this does not affect the
# Iced-only contract.
ferramari-platform = { path = "../ferramari-platform" }

[[bin]]
name = "ferramari-ui"
path = "src/main.rs"

[lib]
name = "ferramari_ui"
path = "src/lib.rs"
