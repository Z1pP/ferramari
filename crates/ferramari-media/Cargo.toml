[package]
name = "ferramari-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ferramari media layer: mpv controller and wallpaper window management"

[dependencies]
ferramari-core = { path = "../ferramari-core" }
anyhow = "1"
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
