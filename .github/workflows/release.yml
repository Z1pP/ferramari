name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches the manifest version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $match = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "tag $tag does not match Cargo.toml $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every workspace target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test every workspace crate
        run: cargo test --workspace --locked
      - name: Build server and Iced UI
        run: cargo build --workspace --release --locked
      - name: Install packaging tools
        run: choco install innosetup gettext -y --no-progress
      - name: Build installer and portable archive
        run: .\installer\build.ps1 -NoBuild
      - uses: actions/upload-artifact@v4
        with:
          name: ferramari-windows
          path: |
            installer/Output/*.exe
            installer/Output/*.zip
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches the manifest version
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "$version" = "$cargo_version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every workspace target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test every workspace crate
        run: cargo test --workspace --locked
      - name: Build server and Iced UI
        run: cargo build --workspace --release --locked
      - name: Package both application binaries
        run: |
          package="ferramari-${VERSION}-x86_64-linux"
          mkdir -p "dist/${package}"
          install -Dm755 target/release/ferramari "dist/${package}/bin/ferramari"
          install -Dm755 target/release/ferramari-ui "dist/${package}/bin/ferramari-ui"
          cp README.md LICENSE "dist/${package}/"
          install -Dm644 data/io.github.ferramari.Ferramari.desktop \
            "dist/${package}/share/applications/io.github.ferramari.Ferramari.desktop"
          install -Dm644 data/io.github.ferramari.Ferramari.metainfo.xml \
            "dist/${package}/share/metainfo/io.github.ferramari.Ferramari.metainfo.xml"
          install -Dm644 data/icons/hicolor/scalable/apps/io.github.ferramari.Ferramari.svg \
            "dist/${package}/share/icons/hicolor/scalable/apps/io.github.ferramari.Ferramari.svg"
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "dist/${package}/share/locale/${lang}/LC_MESSAGES"
            msgfmt -c -o "dist/${package}/share/locale/${lang}/LC_MESSAGES/ferramari.mo" "$po"
          done
          tar -czf "${package}.tar.gz" -C dist "${package}"
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - uses: actions/download-artifact@v4
        with:
          name: ferramari-windows
          path: windows-dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ferramari-*.tar.gz
            ferramari-*.tar.gz.sha256
            windows-dist/*.exe
            windows-dist/*.zip
          generate_release_notes: true
