[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.2.3"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[package]
name = "ferramari"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Video wallpaper for Linux and Windows, written in Rust"
readme = "README.md"
keywords = ["wallpaper", "video", "linux", "windows"]
categories = ["multimedia::video", "graphics"]
default-run = "ferramari"

[[bin]]
name = "ferramari"
path = "src/main.rs"

[[bin]]
name = "ferramari-launcher"
path = "src/launcher.rs"

[dependencies]
serde_json = "1"
ferramari-core = { path = "crates/ferramari-core" }
ferramari-platform = { path = "crates/ferramari-platform" }
ferramari-media = { path = "crates/ferramari-media" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rand = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon, version info and manifest into ferramari.exe. The same
# resource is what the tray loads at runtime; see build.rs.
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true