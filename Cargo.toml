[package]
name = "ferramari"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Video wallpaper for Linux, written in Rust"
readme = "README.md"
keywords = ["wallpaper", "video", "gtk", "linux"]
categories = ["multimedia::video", "graphics"]

[dependencies]
# GTK 3 line: the only toolkit line that still has a WebKitGTK binding
# (webkit2gtk 2.x), which webpage wallpapers need.
gtk = "0.18"
gdk-pixbuf = "0.18"
gdkx11 = "0.18"
gio = "0.18"
glib = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
log = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
x11rb = { version = "0.14", features = ["randr"] }
zbus = "5"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true