name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3, WebKitGTK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config gettext
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches the manifest version
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          test "$version" = "$cargo_version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - name: Package the binary
        run: |
          package="ferramari-${VERSION}-x86_64-linux"
          mkdir -p "dist/${package}"
          cp target/release/ferramari "dist/${package}/"
          cp README.md LICENSE "dist/${package}/"
          install -Dm644 data/io.github.ferramari.Ferramari.desktop \
            "dist/${package}/share/applications/io.github.ferramari.Ferramari.desktop"
          install -Dm644 data/io.github.ferramari.Ferramari.metainfo.xml \
            "dist/${package}/share/metainfo/io.github.ferramari.Ferramari.metainfo.xml"
          install -Dm644 data/icons/hicolor/scalable/apps/io.github.ferramari.Ferramari.svg \
            "dist/${package}/share/icons/hicolor/scalable/apps/io.github.ferramari.Ferramari.svg"
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "dist/${package}/share/locale/${lang}/LC_MESSAGES"
            msgfmt -c -o "dist/${package}/share/locale/${lang}/LC_MESSAGES/ferramari.mo" "$po"
          done
          tar -czf "${package}.tar.gz" -C dist "${package}"
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ferramari-*.tar.gz
            ferramari-*.tar.gz.sha256
          generate_release_notes: true